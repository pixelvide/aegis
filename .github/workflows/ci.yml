name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    name: UI — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack & activate pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  server:
    name: Server — Vet & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # UI embed dir must exist for go build to succeed
      - name: Create UI embed placeholder
        run: mkdir -p cmd/aegis-server/ui && echo "placeholder" > cmd/aegis-server/ui/index.html

      - run: go vet ./...
      - run: go build ./cmd/aegis-server/

  docker:
    name: Docker — Verify Build
    runs-on: ubuntu-latest
    needs: [ui, server]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t aegis-server:ci .
