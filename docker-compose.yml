services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aegis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis

  # ── MailDev (local SMTP for development) ─────────────────────────────────────
  maildev:
    image: maildev/maildev:2.1.0
    container_name: aegis-maildev
    restart: unless-stopped
    ports:
      - "${MAILDEV_WEB_PORT:-1080}:1080"   # Web UI
      - "${MAILDEV_SMTP_PORT:-1025}:1025"  # SMTP
    networks:
      - aegis

  # ── Valkey (session cache + rate limiting) ──────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: aegis-valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - aegis-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis

  # ── Aegis Server (API + embedded UI) ────────────────────────────────────────
  aegis-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aegis-server
    restart: unless-stopped
    ports:
      - "${AEGIS_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis}@postgres:5432/${POSTGRES_DB:-aegis}?sslmode=disable
      VALKEY_URL: ${VALKEY_URL:-valkey:6379}
      JWT_SECRET: ${JWT_SECRET:-}
      AEGIS_BIND: "0.0.0.0"
      AEGIS_PORT: "8080"
      AEGIS_ALLOWED_ORIGINS: ${AEGIS_ALLOWED_ORIGINS:-http://lvh.me:8080}
      AEGIS_BASE_DOMAIN: ${AEGIS_BASE_DOMAIN:-}
      # SMTP — defaults to MailDev for local dev
      SMTP_HOST: ${SMTP_HOST:-maildev}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@aegis.local}
      SMTP_TLS: ${SMTP_TLS:-false}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - aegis

networks:
  aegis:
    driver: bridge

volumes:
  aegis-pgdata:
  aegis-valkey:
